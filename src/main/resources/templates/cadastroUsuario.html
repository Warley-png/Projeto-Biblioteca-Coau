<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">  <!-- Adicionei xmlns:sec para consistência -->
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Usuário - Livraria COAU</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">  <!-- Adicionei Font Awesome para ícones -->
</head>
<body>
    <div class="container" style="padding-top: 80px; max-width: 600px;">
        <h3 class="text-center mb-4">Cadastro de Usuário</h3>
        
        <!-- Formulário de Cadastro -->
        <form th:action="@{/livros/salvarUsuario}" method="post">
            <div class="mb-3">
                <label for="usuario" class="form-label">Nome de Usuário</label>
                <input type="text" class="form-control" id="usuario" name="usuario" placeholder="Digite o nome completo" required />
            </div>
            
            <div class="mb-3">
                <label for="login" class="form-label">Login (Email ou Username)</label>
                <input type="text" class="form-control" id="login" name="login" placeholder="Digite o login único" required />
            </div>
            
            <div class="mb-3">
                <label for="senha" class="form-label">Senha</label>
                <input type="password" class="form-control" id="senha" name="senha" placeholder="Digite uma senha (mín. 6 caracteres)" required />
            </div>
            
            <div class="mb-3">
                <label for="perfil" class="form-label">Perfil</label>
                <select class="form-select" id="perfil" name="perfil" required>
                    <option value="">Selecione um perfil</option>
                    <option value="USER">Usuário</option>
                    <option value="ADMIN">Administrador</option>
                </select>
            </div>
            
            <div class="d-flex gap-2">
                <button type="submit" class="btn btn-success flex-fill">Cadastrar</button>
                <a href="/livros/telaLogin" class="btn btn-secondary flex-fill">Voltar ao Login</a>
            </div>
        </form>
        
        <!-- Melhorei mensagens com ícones -->
        <div th:if="${mensagem}" class="alert alert-success mt-3" role="alert">
            <i class="fas fa-check-circle"></i> <span th:text="${mensagem}">Mensagem de sucesso!</span>
        </div>
        <div th:if="${erro}" class="alert alert-danger mt-3" role="alert">
            <i class="fas fa-exclamation-triangle"></i> <span th:text="${erro}">Erro!</span>
        </div>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
