<!DOCTYPE html>

<html xmlns:th="http://www.thymeleaf.org" 
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
    <head>
        <title>Gerenciar Usuários - COAU</title>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    </head>
    <body class="container mt-5">

        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2><i class="fas fa-users-cog"></i> Gerenciar Usuários</h2>
            <a th:href="@{/livros/telaprincipal}" class="btn btn-outline-secondary btn-sm">
                <i class="fas fa-arrow-left"></i> Voltar
            </a>
        </div>

       
        <div th:if="${mensagem}" class="alert alert-success alert-dismissible fade show" role="alert">
            <i class="fas fa-check-circle"></i> <span th:text="${mensagem}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>
        
        <div th:if="${erro}" class="alert alert-danger" th:text="${erro}"></div>

     
        <table class="table table-striped table-hover mt-3 shadow-sm">
            <thead class="table-dark">
                <tr>
                    <th>Nome</th>
                    <th>Login</th>
                    <th>Perfil</th>
                    <th class="text-center">Ações</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="u : ${usuarios}">
                    <td th:text="${u.usuario}"></td>
                    <td th:text="${u.login}"></td>
                    <td>
                        <span th:classappend="${u.perfil == 'ADMIN' ? 'badge bg-primary' : 'badge bg-secondary'}" 
                              th:text="${u.perfil}">
                        </span>
                    </td>
                    <td class="text-center">
                       
                        <form th:action="@{/livros/resetarSenhaUsuario/{id}(id=${u.iduser})}" method="post" 
                              onsubmit="return confirm('Deseja realmente resetar a senha deste usuário para: mudar123?');" 
                              style="display:inline;">
                            <button type="submit" class="btn btn-warning btn-sm">
                                <i class="fas fa-key"></i> Resetar Senha
                            </button>
                        </form>
                    </td>
                </tr>
            </tbody>
        </table>

        
        <script src="https://jsdelivr.net"></script>
    </body>
</html>
